name: payments
version: 0.1.0
status: draft
category: commerce

supported_starters:
  - starter-web
  - starter-saas-dashboard
  - starter-commerce
  - starter-learning

primary: stripe
alternative: market-specific-provider

dependencies:
  - stripe

env:
  - STRIPE_SECRET_KEY
  - STRIPE_WEBHOOK_SECRET

data_changes: billing customer/subscription/order references as required

verification:
  - test checkout succeeds
  - signed webhook is processed
  - duplicate webhook is safe
  - failed/cancelled payment does not grant entitlement
