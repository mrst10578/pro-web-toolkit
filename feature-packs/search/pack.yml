name: search
version: 0.1.0
status: experimental
category: discovery
supported_starters:
  - starter-web
  - starter-content
  - starter-saas-dashboard
  - starter-cms
  - starter-learning
  - starter-commerce
primary: meilisearch
alternative: none-by-default
dependencies:
  - project-specific
env:
  - MEILISEARCH_HOST
  - MEILISEARCH_API_KEY
