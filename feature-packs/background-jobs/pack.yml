name: background-jobs
version: 0.1.0
status: draft
category: execution

supported_starters:
  - starter-web
  - starter-saas-dashboard
  - starter-ai
  - starter-cms
  - starter-learning
  - starter-commerce

primary: inngest
alternative: trigger-dev

dependencies:
  - project-specific

env:
  - INNGEST_EVENT_KEY
  - INNGEST_SIGNING_KEY

data_changes: optional job/business-state records

verification:
  - job executes outside the request path
  - retry behavior is safe and observable
  - duplicate trigger does not duplicate protected side effects
  - terminal failure is visible/actionable
  - concurrency or rate limits work when required
