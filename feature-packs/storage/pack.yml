name: storage
version: 0.1.0
status: draft
category: files

supported_starters:
  - starter-web
  - starter-saas-dashboard
  - starter-ai
  - starter-cms
  - starter-learning
  - starter-commerce

primary: supabase-storage
alternative: none-by-default

dependencies: []

env:
  - NEXT_PUBLIC_SUPABASE_URL
  - NEXT_PUBLIC_SUPABASE_ANON_KEY

data_changes: optional file metadata tables

verification:
  - allowed upload succeeds
  - invalid upload is rejected
  - private object access is enforced
  - delete/replace behavior is defined
