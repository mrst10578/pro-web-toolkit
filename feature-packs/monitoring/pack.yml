name: monitoring
version: 0.1.0
status: draft
category: observability

supported_starters:
  - starter-web
  - starter-content
  - starter-saas-dashboard
  - starter-ai
  - starter-cms
  - starter-learning
  - starter-commerce

primary: sentry
alternative: none-by-default

dependencies:
  - project-specific

env:
  - SENTRY_DSN
  - SENTRY_AUTH_TOKEN

data_changes: none

verification:
  - test error is captured
  - environment is tagged
  - sensitive data is scrubbed
  - app remains usable if monitoring fails
