name: email
version: 0.1.0
status: draft
category: messaging

supported_starters:
  - starter-web
  - starter-saas-dashboard
  - starter-ai
  - starter-cms
  - starter-learning
  - starter-commerce

primary: resend-react-email
alternative: none-by-default

dependencies:
  - resend
  - react-email

env:
  - RESEND_API_KEY
  - EMAIL_FROM

data_changes: optional delivery/event records

verification:
  - template renders
  - provider request succeeds in test environment
  - invalid recipient/provider failure is handled
  - duplicate-sensitive event is idempotent
