name: database
version: 0.1.0
status: draft
category: data

supported_starters:
  - starter-web
  - starter-saas-dashboard
  - starter-ai
  - starter-cms
  - starter-learning
  - starter-commerce

primary: supabase-postgres
alternative: none-by-default

dependencies: []

env:
  - NEXT_PUBLIC_SUPABASE_URL
  - NEXT_PUBLIC_SUPABASE_ANON_KEY

data_changes: project-specific migrations

verification:
  - migrations apply cleanly
  - required read/write path works
  - unauthorized access is rejected
  - representative query is indexed when needed
