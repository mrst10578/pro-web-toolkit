name: rag
version: 0.1.0
status: experimental
category: intelligence

supported_starters:
  - starter-web
  - starter-saas-dashboard
  - starter-ai
  - starter-cms
  - starter-learning

primary: supabase-postgres-pgvector
alternative: dedicated-vector-database-when-justified

depends_on:
  - ai
  - database
  - storage-when-source-files-persist

dependencies:
  - project-specific

env:
  - NEXT_PUBLIC_SUPABASE_URL
  - NEXT_PUBLIC_SUPABASE_ANON_KEY
  - AI_PROVIDER_API_KEY

data_changes: document chunk metadata and vector columns/indexes

verification:
  - authorized relevant chunks are retrieved
  - unauthorized chunks are excluded
  - retrieval quality is measured on representative queries
  - answer path handles zero-result retrieval
  - source provenance survives ingestion and retrieval
